# Lock screen. ESC or Ctrl+U clears what you typed.
source = ~/.config/hypr/colors-hyprlock.conf

$title = @@FONT_UI@@ Medium
$mono  = @@FONT_MONO@@

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = hud, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 4, hud
    animation = fadeOut, 1, 4, hud
    animation = inputFieldDots, 1, 2, hud
}

# Screenshot of the desktop (live wallpaper frame included), blurred and dimmed
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    contrast = 1.05
    vibrancy = 0.2
}

# Corner brackets, same as everywhere else
shape {
    monitor =
    size = 28, 2
    color = $accent
    rounding = 0
    position = 48, -48
    halign = left
    valign = top
}
shape {
    monitor =
    size = 2, 28
    color = $accent
    rounding = 0
    position = 48, -48
    halign = left
    valign = top
}
shape {
    monitor =
    size = 28, 2
    color = $accent
    rounding = 0
    position = -48, -48
    halign = right
    valign = top
}
shape {
    monitor =
    size = 2, 28
    color = $accent
    rounding = 0
    position = -48, -48
    halign = right
    valign = top
}
shape {
    monitor =
    size = 28, 2
    color = $accent
    rounding = 0
    position = 48, 48
    halign = left
    valign = bottom
}
shape {
    monitor =
    size = 2, 28
    color = $accent
    rounding = 0
    position = 48, 48
    halign = left
    valign = bottom
}
shape {
    monitor =
    size = 28, 2
    color = $accent
    rounding = 0
    position = -48, 48
    halign = right
    valign = bottom
}
shape {
    monitor =
    size = 2, 28
    color = $accent
    rounding = 0
    position = -48, 48
    halign = right
    valign = bottom
}

# Machine name
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/lock-date --title
    font_size = 11
    font_family = $mono
    color = $dim
    position = 92, -60
    halign = left
    valign = top
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 120
    font_family = $title
    color = $text
    position = 0, 170
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] ~/.local/bin/lock-date
    font_size = 13
    font_family = $mono
    color = $accent
    position = 0, 70
    halign = center
    valign = center
}

# Your name
label {
    monitor =
    text = cmd[update:0] getent passwd $USER | cut -d: -f5
    font_size = 17
    font_family = $title
    color = $text
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 50
    outline_thickness = 2
    rounding = 3
    inner_color = $surface
    outer_color = $accent $accent2 45deg
    check_color = $accent2
    fail_color = $error
    font_color = $text
    font_family = $mono
    fade_on_empty = false
    placeholder_text = <span letter_spacing="2000">@@t:password@@</span>
    fail_text = <span letter_spacing="1000">$PAMFAIL</span>
    dots_size = 0.22
    dots_spacing = 0.45
    position = 0, -80
    halign = center
    valign = center
}

# Hint at the bottom
label {
    monitor =
    text = @@t:lock_hint@@
    font_size = 10
    font_family = $mono
    color = $dim
    position = 0, 60
    halign = center
    valign = bottom
}
