# Idle: lock after @@LOCK_AFTER@@ min, screen off after @@SCREEN_OFF_AFTER@@ min, never suspends.
# Change the times with `automata`. Fullscreen stuff blocks all this (idle_inhibit rule in hyprland.lua)

general {
    # if hyprlock dies, try again up to 5 times instead of leaving you unlocked
    lock_cmd = pidof hyprlock || sh -c 'for i in 1 2 3 4 5; do hyprlock && exit; sleep 1; done'
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
}

listener {
    timeout = @@LOCK_SECONDS@@
    on-timeout = loginctl lock-session
}

# Monitor takes Hyprland down when it turns off? See docs/troubleshooting.md
listener {
    timeout = @@SCREEN_OFF_SECONDS@@
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
