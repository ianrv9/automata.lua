# automata.lua settings. Edit by hand or just run `automata`, then `automata apply`.
# Format is KEY="value" so both bash and Lua can read it. Keep it that way.

LANGUAGE="en"

# Wallpapers + colors
WALLPAPER_DIR="$HOME/Pictures/Wallpapers"
COLOR_SCHEME="scheme-content"
BASE_COLOR="#b6c4ff"          # palette used before you ever pick a wallpaper

# Apps
TERMINAL="kitty"
FILE_MANAGER="thunar"
BROWSER="firefox"
OBSIDIAN_VAULT=""             # filled in by the installer
SPOTIFY_PATH=""               # same

# Monitors: "name|mode|position|scale" separated by ";". Empty = everything at its preferred mode.
# mode: preferred, highrr, highres or e.g. 2560x1440@144 · position: auto, auto-right, auto-left, auto-up, auto-down
MONITORS=""
GPU="other"                   # nvidia turns on the env vars Hyprland's wiki asks for (installer detects it)

# Keyboard
KB_LAYOUT="us"
KB_VARIANT=""

# Look
GAPS_IN="6"
GAPS_OUT="14"
BORDER_SIZE="2"
ROUNDING="4"
BLUR="yes"
ANIMATIONS="fast"             # fast | relaxed | off
INACTIVE_OPACITY="0.94"
BAR_POSITION="top"            # top | bottom
FONT_UI="Space Grotesk"
FONT_MONO="JetBrainsMono Nerd Font"

# Idle, in minutes. 0 = never
LOCK_AFTER="10"
SCREEN_OFF_AFTER="11"
